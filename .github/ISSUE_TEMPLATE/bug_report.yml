name: Bug report
description: Report a reproducible problem with github-runner-tools
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include registration tokens, PATs, SSH keys, passwords, or other secrets. For security-sensitive issues, follow SECURITY.md instead of opening a public issue.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Tag, branch, or commit SHA where the problem occurs.
      placeholder: e.g. main at abc1234
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Debian 13
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x86_64 / amd64
        - ARM64 / aarch64
        - Other
    validations:
      required: true

  - type: input
    id: runner_version
    attributes:
      label: GitHub Actions Runner version
      description: If relevant, provide the runner version shown by the service or logs.
      placeholder: e.g. 2.337.0

  - type: textarea
    id: command
    attributes:
      label: Command or workflow
      description: Show the command or workflow configuration that triggered the problem.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove all secrets and sensitive repository or host details before posting.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Include whether the problem reproduces consistently and any recovery steps already tried.

  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed tokens, passwords, private keys, and other secrets from this report.
          required: true
        - label: This is not a security-sensitive vulnerability requiring private disclosure.
          required: true
