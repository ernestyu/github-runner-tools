name: Artifact quota smoke

on:
  push:
    branches: [main]

jobs:
  artifact-quota-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Create tiny artifact
        run: printf 'artifact quota smoke\n' > quota-smoke.txt

      - name: Upload tiny artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-quota-smoke
          path: quota-smoke.txt
          retention-days: 1
