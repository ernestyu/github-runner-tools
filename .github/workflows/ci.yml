name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq rsync
      - name: Run test suite
        run: bash tests/run-all.sh
