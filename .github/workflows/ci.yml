name: Development Check

on:
  push:
    branches:
      - main
      - 'impl/**'
      - 'fix/**'
      - 'spec/**'
  pull_request:

permissions:
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Python syntax
        run: |
          python3 -m compileall -q web scripts/cli-operational-logger.py
          python3 tests/test-cli-operational-logging.py
      - name: V2 executor contract
        run: |
          python3 tests/test-web-v2-executor-contract.py
          python3 tests/test-web-v2-status.py
          python3 tests/test-web-v2-token-fd.py
          python3 tests/test-web-v2-executor-transport.py
          python3 tests/test-web-v2-cli-executor-flags.py
          python3 tests/test-web-v2-cli-launcher.py
          python3 tests/test-web-v2-executor-daemon.py
          python3 tests/test-web-v2-integration.py
          python3 tests/test-web-v2-privileged.py
          python3 tests/test-web-v2-cli-spawn.py
          python3 tests/test-web-v2-mutation.py
          python3 tests/test-web-v2-remove-guard.py
          python3 tests/test-web-v2-binding.py
          python3 tests/test-web-v2-event-loop.py
          python3 tests/test-web-v2-unit-installer.py
          python3 tests/test-web-v2-failure.py
          bash tests/test-web-v2-setup.sh
          python3 tests/test-web-v2-cutover-faults.py
          python3 tests/test-web-v2-real-private-channel.py
          python3 tests/test-web-v2-install-manifest.py
          python3 tests/test-web-v2-real-spawn.py
          python3 tests/test-web-v2-real-pty-cli.py
          python3 tests/test-web-v2-closeout.py
          python3 tests/test-web-v2-code-provenance.py
          sudo -n /usr/bin/python3 tests/test-web-v2-real-uid-drop.py
          bash tests/test-web-v2-shared-create.sh
          bash tests/test-web-v2-real-create-cli.sh
          bash tests/test-web-v2-real-remove-cli.sh
          bash tests/test-web-v2-shared-remove.sh
          python3 tests/test-web-v2-cli-remove-authority.py
      - name: Existing pure and Web compatibility regression
        run: |
          bash tests/test-pure.sh
          python3 tests/test-web-management.py
