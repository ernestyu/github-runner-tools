name: Local Artifact Fail-Closed Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/local-artifact-failclosed-smoke.yml"

jobs:
  failclosed-smoke:
    if: github.event.head_commit.message == 'Run local artifact fail-closed smoke'
    runs-on: [self-hosted, Linux, X64, github-runner-tools]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove disposable workspace before completed hook
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          rm -rf -- "$GITHUB_WORKSPACE"
          echo "Workspace intentionally removed for fail-closed acceptance test"
