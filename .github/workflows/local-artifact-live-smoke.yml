name: Local Artifact Live Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/local-artifact-live-smoke.yml"

jobs:
  live-smoke:
    if: github.event.head_commit.message == 'Run local artifact live smoke'
    runs-on: [self-hosted, Linux, X64, github-runner-tools]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create live smoke evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          cat > results/live-smoke.txt <<EOF
          repository=${GITHUB_REPOSITORY}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          job=${GITHUB_JOB}
          sha=${GITHUB_SHA}
          runner=${RUNNER_NAME}
          EOF
          dd if=/dev/zero of=results/test-payload.bin bs=1M count=5 status=none
          ls -lh results/
